name: Validate Plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # make check-gitleaks scans every commit, as it does locally.
          fetch-depth: 0

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Install gitleaks
        run: |
          set -eu
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          tarball="gitleaks_${version}_linux_x64.tar.gz"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT INT TERM
          curl -sSfL -o "$tmp/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
          echo "${sha256}  $tmp/$tarball" | sha256sum -c -
          tar -xzf "$tmp/$tarball" -C "$tmp" gitleaks
          bindir="$HOME/.local/bin"
          mkdir -p "$bindir"
          install -m 0755 "$tmp/gitleaks" "$bindir/gitleaks"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/gitleaks" version

      - name: Run checks
        run: make check
